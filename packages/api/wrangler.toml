name = "pdc-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Create the namespace with `npx wrangler kv namespace create PDC_KV`, then paste the returned id below.
[[kv_namespaces]]
binding = "PDC_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

[vars]
# "*" or a comma-separated list of origins, e.g. "https://zanderjensen7.github.io"
ALLOWED_ORIGINS = "*"
